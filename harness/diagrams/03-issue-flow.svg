<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1d4ed8"/></marker>
    <style>
      .t{font-size:12.5px;fill:#111827} .sub{font-size:10px} .h{font-size:12.5px;font-weight:700}
      .ttl{font-size:18px;font-weight:700;fill:#0f172a} .band{font-size:11px;font-weight:700;fill:#475569}
      .e{stroke:#1d4ed8;stroke-width:1.6;fill:none;marker-end:url(#a3)} .async{stroke:#b45309;stroke-dasharray:6 4}
      .num{font-size:11px;font-weight:700;fill:#1d4ed8} .numa{fill:#b45309}
      rect.box{rx:8;ry:8;stroke-width:1.6}
      .consumer{fill:#dbeafe;stroke:#1e40af} .sdk{fill:#bbf7d0;stroke:#166534;stroke-width:2.2}
      .int{fill:#d1fae5;stroke:#047857} .sec{fill:#fee2e2;stroke:#b91c1c;stroke-width:2} .ext{fill:#e5e7eb;stroke:#6b7280}
      .step{font-size:11.5px;fill:#1f2937}
    </style>
  </defs>

  <text x="24" y="32" class="ttl">View 3 — Key flow: issue → mint/deploy a tokenized asset</text>

  <!-- nodes -->
  <rect class="box consumer" x="40"  y="70"  width="170" height="50"/><text x="125" y="92" text-anchor="middle" class="h">Consumer</text><text x="125" y="108" text-anchor="middle" class="t sub">issuer app</text>
  <rect class="box sdk"      x="40"  y="170" width="170" height="50"/><text x="125" y="192" text-anchor="middle" class="h">ApiClient (core)</text><text x="125" y="208" text-anchor="middle" class="t sub">assets/tokens modules</text>
  <rect class="box int"      x="300" y="170" width="200" height="50"/><text x="400" y="192" text-anchor="middle" class="h">Server API + MW</text><text x="400" y="208" text-anchor="middle" class="t sub">authn · tenant · idempotency</text>
  <rect class="box int"      x="300" y="290" width="200" height="50"/><text x="400" y="312" text-anchor="middle" class="h">Compliance / Policy</text><text x="400" y="328" text-anchor="middle" class="t sub">off-chain gate</text>
  <rect class="box sec"      x="300" y="410" width="200" height="50"/><text x="400" y="432" text-anchor="middle" class="h">Signing + Custody/KMS</text><text x="400" y="448" text-anchor="middle" class="t sub">key never leaves boundary</text>
  <rect class="box ext"      x="620" y="410" width="200" height="50"/><text x="720" y="432" text-anchor="middle" class="h">EVM</text><text x="720" y="448" text-anchor="middle" class="t sub">TokenFactory / ERC-3643</text>
  <rect class="box int"      x="620" y="530" width="200" height="50"/><text x="720" y="552" text-anchor="middle" class="h">IndexingEngine</text><text x="720" y="568" text-anchor="middle" class="t sub">event sync, confirm</text>
  <rect class="box sec"      x="40"  y="410" width="170" height="50"/><text x="125" y="432" text-anchor="middle" class="h">Audit chain</text><text x="125" y="448" text-anchor="middle" class="t sub">hash-chained receipts</text>

  <!-- boundary annotations -->
  <line x1="240" y1="60" x2="240" y2="600" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="248" y="600" class="band">↑ trust boundary (Bearer sk_, org-scoped, Idempotency-Key)</text>
  <rect x="290" y="400" width="220" height="70" rx="9" fill="none" stroke="#b91c1c" stroke-dasharray="5 4"/>
  <text x="300" y="478" class="band" fill="#b91c1c">security boundary</text>

  <!-- edges with step numbers (blue=sync, amber dashed=async) -->
  <path class="e" d="M125,120 L125,170"/><text x="92" y="148" class="num">1</text>
  <path class="e" d="M210,185 L300,185"/><text x="250" y="178" class="num">2</text><text x="250" y="232" class="step sub">create asset</text>
  <path class="e" d="M400,220 L400,290"/><text x="408" y="258" class="num">3</text><text x="416" y="262" class="step sub">policy check</text>
  <path class="e" d="M300,300 L210,420"/><text x="248" y="360" class="num">4</text><text x="150" y="330" class="step sub">audit asset.created</text>
  <path class="e" d="M300,205 L210,205" /><text x="250" y="200" class="num">5</text>
  <path class="e" d="M400,340 L400,410"/><text x="408" y="378" class="num">6</text><text x="416" y="382" class="step sub">sign deploy tx</text>
  <path class="e async" d="M500,435 L620,435"/><text x="556" y="428" class="num numa">7</text><text x="540" y="402" class="step sub" fill="#b45309">submit (async)</text>
  <path class="e async" d="M720,460 L720,530"/><text x="728" y="498" class="num numa">8</text><text x="736" y="502" class="step sub" fill="#b45309">emit Deployed</text>
  <path class="e async" d="M620,555 L500,445"/><text x="556" y="520" class="num numa">9</text><text x="430" y="520" class="step sub" fill="#b45309">confirm addr+block</text>
  <path class="e" d="M300,430 L210,430"/><text x="250" y="424" class="num">10</text><text x="250" y="406" class="step sub">audit token.deployed</text>
  <path class="e" d="M340,410 L180,235"/><text x="250" y="300" class="num">11</text>

  <!-- numbered legend / narrative -->
  <rect x="860" y="64" width="180" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="870" y="84" class="band">STEPS</text>
  <text x="870" y="106" class="step">1  call assets.create</text>
  <text x="870" y="126" class="step">2  POST /assets (sync)</text>
  <text x="870" y="146" class="step">3  off-chain policy gate</text>
  <text x="870" y="166" class="step">4  audit: asset.created</text>
  <text x="870" y="186" class="step">5  201 {asset.id}</text>
  <text x="870" y="206" class="step">6  tokens.create→deploy,</text>
  <text x="884" y="222" class="step sub">sign (key isolated)</text>
  <text x="870" y="242" class="step">7  submit deploy tx</text>
  <text x="884" y="258" class="step sub">ComplianceToken (async)</text>
  <text x="870" y="278" class="step">8  chain emits Deployed</text>
  <text x="870" y="298" class="step">9  indexer confirms</text>
  <text x="870" y="318" class="step">10 audit: token.deployed</text>
  <text x="884" y="334" class="step sub">+ decision receipt</text>
  <text x="870" y="354" class="step">11 get → {deployed,addr}</text>

  <!-- legend edges -->
  <rect x="860" y="378" width="180" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="872" y1="398" x2="906" y2="398" class="e"/><text x="914" y="402" class="step sub">sync call</text>
  <line x1="872" y1="420" x2="906" y2="420" class="e async"/><text x="914" y="424" class="step sub">async (on-chain/index)</text>
</svg>
