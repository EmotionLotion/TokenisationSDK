<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#374151"/></marker>
    <style>
      .t{font-size:12.5px;fill:#111827} .sub{font-size:10px} .h{font-size:12.5px;font-weight:700}
      .ttl{font-size:18px;font-weight:700;fill:#0f172a} .band{font-size:12px;font-weight:700;fill:#334155}
      .lbl{font-size:10px;fill:#475569}
      .e{stroke:#374151;stroke-width:1.3;fill:none;marker-end:url(#a2)} .async{stroke-dasharray:5 4}
      rect.box{rx:7;ry:7;stroke-width:1.3}
      .pub{fill:#bbf7d0;stroke:#166534;stroke-width:2.2} .int{fill:#d1fae5;stroke:#047857}
      .sec{fill:#fee2e2;stroke:#b91c1c;stroke-width:2} .ext{fill:#e5e7eb;stroke:#6b7280}
      .xc{fill:#fef9c3;stroke:#a16207} .layer{fill:#f8fafc;stroke:#cbd5e1;stroke-dasharray:4 3}
    </style>
  </defs>

  <text x="24" y="32" class="ttl">View 2 — Container / Layer view (C4 L2) · arrows point toward dependencies</text>

  <!-- cross-cutting side band -->
  <rect class="box xc" x="864" y="70" width="156" height="710"/>
  <text x="942" y="92" text-anchor="middle" class="band">⟂ CROSS-CUTTING</text>
  <text x="942" y="120" text-anchor="middle" class="t sub">config / secrets</text>
  <text x="942" y="150" text-anchor="middle" class="t sub">auth: API-key,</text>
  <text x="942" y="164" text-anchor="middle" class="t sub">OAuth2, SIWE</text>
  <text x="942" y="194" text-anchor="middle" class="t sub">observability (OTel)</text>
  <text x="942" y="224" text-anchor="middle" class="t sub">hash-chained audit</text>
  <text x="942" y="254" text-anchor="middle" class="t sub">versioning</text>
  <text x="942" y="284" text-anchor="middle" class="t sub">feature flags</text>
  <text x="942" y="298" text-anchor="middle" class="t sub">(ENABLED_VERTICALS)</text>

  <!-- helper: each layer band -->
  <!-- L1 PUBLIC -->
  <rect class="layer" x="24" y="70" width="820" height="86" rx="9"/>
  <text x="34" y="88" class="band">① PUBLIC API — @tokenisation/core (developer-facing)</text>
  <rect class="box pub" x="40"  y="98" width="240" height="48"/><text x="160" y="118" text-anchor="middle" class="h">ApiClient / createApiClient</text><text x="160" y="134" text-anchor="middle" class="t sub">12 modules: assets,tokens,transfers…</text>
  <rect class="box pub" x="300" y="98" width="240" height="48"/><text x="420" y="118" text-anchor="middle" class="h">Typed models + errors</text><text x="420" y="134" text-anchor="middle" class="t sub">SDKError/ErrorCode · zod</text>
  <rect class="box pub" x="560" y="98" width="270" height="48"/><text x="695" y="118" text-anchor="middle" class="h">HttpClient</text><text x="695" y="134" text-anchor="middle" class="t sub">Bearer · retries · idempotency-key</text>

  <!-- L2 DOMAIN -->
  <rect class="layer" x="24" y="172" width="820" height="86" rx="9"/>
  <text x="34" y="190" class="band">② DOMAIN / TOKEN LIFECYCLE</text>
  <rect class="box int" x="40"  y="200" width="250" height="48"/><text x="165" y="220" text-anchor="middle" class="h">LifecycleEngine + StateMachine</text><text x="165" y="236" text-anchor="middle" class="t sub">issue·mint·transfer·burn·redeem</text>
  <rect class="box int" x="310" y="200" width="240" height="48"/><text x="430" y="220" text-anchor="middle" class="h">RightType / AssetAbstraction</text><text x="430" y="236" text-anchor="middle" class="t sub">supply · decimals · metadata</text>
  <rect class="box int" x="570" y="200" width="260" height="48"/><text x="700" y="220" text-anchor="middle" class="h">Vertical packs</text><text x="700" y="236" text-anchor="middle" class="t sub">realestate · loyalty · …</text>

  <!-- L3 COMPLIANCE -->
  <rect class="layer" x="24" y="274" width="820" height="86" rx="9"/>
  <text x="34" y="292" class="band">③ COMPLIANCE &amp; POLICY (enforced in-SDK AND on-chain)</text>
  <rect class="box int" x="40"  y="302" width="380" height="48"/><text x="230" y="322" text-anchor="middle" class="h">ComplianceEngine + KYC plugin</text><text x="230" y="338" text-anchor="middle" class="t sub">identity binding · jurisdiction · allow/deny</text>
  <rect class="box int" x="440" y="302" width="390" height="48"/><text x="635" y="322" text-anchor="middle" class="h">PolicyEvaluator</text><text x="635" y="338" text-anchor="middle" class="t sub">transfer restrictions · limits · freeze/seize</text>

  <!-- L4 ADAPTER -->
  <rect class="layer" x="24" y="376" width="820" height="86" rx="9"/>
  <text x="34" y="394" class="band">④ PROTOCOL / ADAPTER — @tokenisation/chains (keeps public API chain-agnostic)</text>
  <rect class="box int" x="40"  y="404" width="390" height="48"/><text x="235" y="424" text-anchor="middle" class="h">Contract adapters</text><text x="235" y="440" text-anchor="middle" class="t sub">ERC-20/721/1155/1410/4626/SBT</text>
  <rect class="box int" x="450" y="404" width="380" height="48"/><text x="640" y="424" text-anchor="middle" class="h">ChainService + ABIs/encoders</text><text x="640" y="440" text-anchor="middle" class="t sub">ethers + viem</text>

  <!-- L5 CRYPTO -->
  <rect class="layer" x="24" y="478" width="820" height="86" rx="9"/>
  <text x="34" y="496" class="band">⑤ CRYPTO / KEY MANAGEMENT</text>
  <rect class="box sec" x="40"  y="506" width="380" height="48"/><text x="230" y="526" text-anchor="middle" class="h">SigningService</text><text x="230" y="542" text-anchor="middle" class="t sub">tx assembly · nonce mgmt</text>
  <rect class="box sec" x="440" y="506" width="390" height="48"/><text x="635" y="526" text-anchor="middle" class="h">Custody adapters</text><text x="635" y="542" text-anchor="middle" class="t sub">local · AWS KMS · Fireblocks · BitGo</text>

  <!-- L6 INFRA -->
  <rect class="layer" x="24" y="580" width="820" height="116" rx="9"/>
  <text x="34" y="598" class="band">⑥ INFRASTRUCTURE / PROVIDERS</text>
  <rect class="box int" x="40"  y="608" width="380" height="48"/><text x="230" y="628" text-anchor="middle" class="h">Server API @tokenisation/server</text><text x="230" y="644" text-anchor="middle" class="t sub">48 routers · auth/idempotency/audit MW · IAM</text>
  <rect class="box int" x="440" y="608" width="180" height="48"/><text x="530" y="628" text-anchor="middle" class="h">IndexingEngine</text><text x="530" y="644" text-anchor="middle" class="t sub">event sync · cap-table</text>
  <rect class="box int" x="630" y="608" width="200" height="48"/><text x="730" y="628" text-anchor="middle" class="h">Storage + DatabaseAdapter</text><text x="730" y="644" text-anchor="middle" class="t sub">S3/IPFS · Postgres · queue</text>
  <rect class="box int" x="40"  y="660" width="380" height="30"/><text x="230" y="679" text-anchor="middle" class="t">Payment/Settlement providers — Stripe · Circle · CCIP</text>

  <!-- EXTERNAL -->
  <rect class="layer" x="24" y="710" width="820" height="70" rx="9"/>
  <text x="34" y="728" class="band">EXTERNAL</text>
  <rect class="box ext" x="40"  y="736" width="150" height="36"/><text x="115" y="758" text-anchor="middle" class="t">EVM RPC</text>
  <rect class="box ext" x="200" y="736" width="150" height="36"/><text x="275" y="758" text-anchor="middle" class="t">Chainlink</text>
  <rect class="box sec" x="360" y="736" width="160" height="36"/><text x="440" y="758" text-anchor="middle" class="t">KMS / Custody HW</text>
  <rect class="box ext" x="530" y="736" width="150" height="36"/><text x="605" y="758" text-anchor="middle" class="t">KYC providers</text>
  <rect class="box ext" x="690" y="736" width="140" height="36"/><text x="760" y="758" text-anchor="middle" class="t">Postgres/Redis</text>

  <!-- dependency edges (downward) -->
  <path class="e" d="M160,146 L165,200"/>
  <path class="e" d="M165,248 L210,302"/>
  <path class="e" d="M250,350 L235,404"/>
  <path class="e" d="M235,452 L230,506"/>
  <path class="e" d="M695,146 L700,200"/>
  <path class="e" d="M700,248 L700,302" opacity="0"/>
  <path class="e" d="M695,150 C760,300 520,560 320,608"/><text x="560" y="300" class="lbl">HttpClient → Server</text>
  <path class="e" d="M230,656 L230,608" opacity="0"/>
  <path class="e" d="M230,350 C120,420 110,540 120,608"/><text x="60" y="470" class="lbl">compliance via server</text>
  <path class="e" d="M640,452 L130,736"/>
  <path class="e" d="M635,554 L440,736"/>
  <path class="e" d="M230,656 L275,736"/>
  <path class="e" d="M730,656 L760,736"/>
  <path class="e" d="M530,656 L605,736"/>

  <!-- legend -->
  <rect x="540" y="22" width="300" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="548" y="32" width="14" height="10" class="box pub"/><text x="566" y="41" class="lbl">public</text>
  <rect x="612" y="32" width="14" height="10" class="box int"/><text x="630" y="41" class="lbl">SDK internal</text>
  <rect x="708" y="32" width="14" height="10" class="box sec"/><text x="726" y="41" class="lbl">security</text>
  <rect x="784" y="32" width="14" height="10" class="box ext"/><text x="802" y="41" class="lbl">external</text>
</svg>
