<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TokenisationSDK — Architecture Diagrams</title>
  <style>
    body{font-family:Segoe UI,Helvetica,Arial,sans-serif;margin:0;background:#f1f5f9;color:#0f172a}
    header{background:#0f172a;color:#fff;padding:18px 24px}
    header h1{margin:0;font-size:18px} header p{margin:4px 0 0;font-size:13px;color:#cbd5e1}
    main{max-width:1100px;margin:0 auto;padding:24px}
    section{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:24px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    section h2{margin:0 0 12px;font-size:15px}
    .frame{overflow-x:auto;border:1px solid #eef2f7;border-radius:8px;background:#fff}
    object,img{display:block;width:100%;height:auto}
    a{color:#1d4ed8}
  </style>
</head>
<body>
  <header>
    <h1>TokenisationSDK — Architecture (pre-rendered SVG)</h1>
    <p>Open in any browser. No Mermaid renderer required. Source: harness/diagrams/*.svg</p>
  </header>
  <main>
    <section>
      <h2>1 · System Context (C4 L1)</h2>
      <div class="frame"><object type="image/svg+xml" data="01-system-context.svg" aria-label="System context diagram"></object></div>
    </section>
    <section>
      <h2>2 · Container / Layer view (C4 L2)</h2>
      <div class="frame"><object type="image/svg+xml" data="02-layer-view.svg" aria-label="Layer view diagram"></object></div>
    </section>
    <section>
      <h2>3 · Key flow — issue → mint/deploy a tokenized asset</h2>
      <div class="frame"><object type="image/svg+xml" data="03-issue-flow.svg" aria-label="Issue flow diagram"></object></div>
    </section>
  </main>
</body>
</html>
