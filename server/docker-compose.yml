version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ahoy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ahoy
      POSTGRES_PASSWORD: ahoy_dev_password
      POSTGRES_DB: ahoy_tokenisation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahoy -d ahoy_tokenisation"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ahoy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
