name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'
  FOUNDRY_PROFILE: ci

jobs:
  # ============================================================================
  # SDK Tests
  # ============================================================================
  sdk-test:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build --workspace=sdk

      - name: Run SDK tests
        run: npm run test --workspace=sdk -- --run

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./sdk/coverage/lcov.info
          flags: sdk
          fail_ci_if_error: false

  # ============================================================================
  # Smart Contract Tests
  # ============================================================================
  contract-test:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge build
        working-directory: ./contracts
        run: forge build --sizes

      - name: Run Forge tests
        working-directory: ./contracts
        run: forge test -vvv

      - name: Run Forge coverage
        working-directory: ./contracts
        run: forge coverage --report lcov

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./contracts/lcov.info
          flags: contracts
          fail_ci_if_error: false

  # ============================================================================
  # Lint & Type Check
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build --workspace=sdk

      - name: Lint Solidity
        working-directory: ./contracts
        run: |
          npm install -g solhint
          solhint 'src/**/*.sol' || true

  # ============================================================================
  # Security Scan
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=high || true

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither
        working-directory: ./contracts
        run: slither . --exclude-dependencies || true
        continue-on-error: true

  # ============================================================================
  # Build Artifacts
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [sdk-test, contract-test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build --workspaces --if-present

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist/
          retention-days: 7
