name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'
  FOUNDRY_PROFILE: ci

jobs:
  # ============================================================================
  # SDK Tests
  # ============================================================================
  sdk-test:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter sdk run build

      - name: Run SDK tests
        run: pnpm --filter sdk run test -- --run

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./sdk/coverage/lcov.info
          flags: sdk
          fail_ci_if_error: false

  # ============================================================================
  # Server Tests
  # ============================================================================
  server-test:
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Server tests
        run: pnpm --filter @tokenisation/server run test

  # ============================================================================
  # Smart Contract Tests
  # ============================================================================
  contract-test:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge build
        working-directory: ./contracts
        run: forge build --sizes

      - name: Run Forge tests
        working-directory: ./contracts
        run: forge test -vvv

      - name: Run Forge coverage
        working-directory: ./contracts
        run: forge coverage --report lcov

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./contracts/lcov.info
          flags: contracts
          fail_ci_if_error: false

  # ============================================================================
  # Lint & Type Check
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check SDK
        run: pnpm --filter sdk run build

      - name: Type check Server
        run: pnpm --filter @tokenisation/server run build

      - name: Lint Solidity
        working-directory: ./contracts
        run: |
          npm install -g solhint
          solhint 'src/**/*.sol'

      - name: Lint Server
        run: |
          cd server
          npx eslint src/ --ext .ts --max-warnings 0 2>/dev/null || echo "::warning::ESLint not configured for server — add .eslintrc"

      - name: Lint SDK
        run: |
          cd sdk
          npx eslint src/ --ext .ts --max-warnings 0 2>/dev/null || echo "::warning::ESLint not configured for SDK — add .eslintrc"

  # ============================================================================
  # Security Scan
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Run pnpm audit
        run: pnpm audit --audit-level=critical

      - name: Check for high vulnerabilities
        run: |
          pnpm audit --audit-level=high 2>&1 || echo "::warning::High severity vulnerabilities found — review before release"

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither
        working-directory: ./contracts
        run: slither . --exclude-dependencies
        continue-on-error: true

  # ============================================================================
  # SAST - Static Application Security Testing
  # ============================================================================
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ============================================================================
  # Build Artifacts
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [sdk-test, server-test, contract-test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist/
          retention-days: 7

  # ============================================================================
  # API Integration Tests (Real Estate + GPU Compute E2E)
  # ============================================================================
  integration-test:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: [sdk-test, server-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start server
        working-directory: ./server
        run: |
          cp .env.example .env 2>/dev/null || true
          npx tsx src/index.ts &
          sleep 5
          curl -f http://localhost:3001/health || exit 1
        env:
          AUTH_DEV_MODE: 'true'
          DB_MODE: sqlite
          ENABLED_VERTICALS: 'real-estate,gpu-compute'

      - name: Run integration tests
        working-directory: ./server
        run: npx vitest run --config vitest.integration.config.ts

  # ============================================================================
  # E2E Tests (Playwright)
  # ============================================================================
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: pnpm -r run build

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # Readiness Scorecard
  # ============================================================================
  readiness:
    name: Readiness Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter sdk run build

      - name: Check SDK bundle size
        run: |
          cd sdk && npx size-limit --json > size-report.json 2>&1 || true
          echo "## Readiness Scorecard" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          npx size-limit 2>&1 | tee -a $GITHUB_STEP_SUMMARY || echo "| SDK Bundle Size | OVER BUDGET |" >> $GITHUB_STEP_SUMMARY

      - name: Run coverage
        run: |
          pnpm --filter sdk run test -- --run --coverage
          echo "| Coverage | See Codecov |" >> $GITHUB_STEP_SUMMARY

      - name: Security audit
        run: |
          AUDIT=$(pnpm audit --audit-level=high 2>&1 || true)
          VULNS=$(echo "$AUDIT" | grep -c "high\|critical" || echo "0")
          echo "| High/Critical Vulns | ${VULNS} |" >> $GITHUB_STEP_SUMMARY
