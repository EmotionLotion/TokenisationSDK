# Tokenisation SDK - Kubernetes Deployment
# Production-ready k8s manifests

---
# ============================================================================
# Namespace
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: tokenisation
  labels:
    app: tokenisation-sdk

---
# ============================================================================
# ConfigMap
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: tokenisation-config
  namespace: tokenisation
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  API_PORT: "3000"
  METRICS_PORT: "9090"

---
# ============================================================================
# Secret (use external secret manager in production)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: tokenisation-secrets
  namespace: tokenisation
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:password@postgres:5432/tokenisation"
  REDIS_URL: "redis://redis:6379"
  JWT_SECRET: "change-me-use-external-secrets-manager"

---
# ============================================================================
# API Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenisation-api
  namespace: tokenisation
  labels:
    app: tokenisation-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tokenisation-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tokenisation-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tokenisation-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: tokenisation-sdk:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tokenisation-config
            - secretRef:
                name: tokenisation-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: tokenisation-api
                topologyKey: kubernetes.io/hostname

---
# ============================================================================
# Service
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: tokenisation-api
  namespace: tokenisation
  labels:
    app: tokenisation-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: tokenisation-api

---
# ============================================================================
# Ingress
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tokenisation-api
  namespace: tokenisation
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.tokenisation.example.com
      secretName: tokenisation-tls
  rules:
    - host: api.tokenisation.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tokenisation-api
                port:
                  name: http

---
# ============================================================================
# Horizontal Pod Autoscaler
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tokenisation-api
  namespace: tokenisation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tokenisation-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ============================================================================
# Pod Disruption Budget
# ============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tokenisation-api
  namespace: tokenisation
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: tokenisation-api

---
# ============================================================================
# Service Account
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tokenisation-api
  namespace: tokenisation

---
# ============================================================================
# Network Policy
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tokenisation-api
  namespace: tokenisation
spec:
  podSelector:
    matchLabels:
      app: tokenisation-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to: # Allow external HTTPS (for RPC nodes)
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
