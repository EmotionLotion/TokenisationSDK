# Default values for governance-service
# This is a YAML-formatted file.

replicaCount: 2

image:
  repository: tokenisation/governance-service
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

environment: "development"

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  metricsPort: 9090

# Database configuration
database:
  host: ""
  name: "tokenisation"
  port: 5432

# Secret values (set via --set or externally)
secrets:
  databasePassword: ""
  jwtSecret: ""

# Pod resources
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70
  targetMemoryUtilization: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: governance.example.com
  tls:
    enabled: false
    secretName: ""

# Health checks
probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Network policy
networkPolicy:
  enabled: true
