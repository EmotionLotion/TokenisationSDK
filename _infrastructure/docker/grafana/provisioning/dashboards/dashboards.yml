# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'Tokenisation Platform'
    orgId: 1
    folder: 'Tokenisation'
    folderUid: tokenisation
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
