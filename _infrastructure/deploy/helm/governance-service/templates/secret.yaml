apiVersion: v1
kind: Secret
metadata:
  name: {{ include "governance-service.fullname" . }}-secrets
  labels:
    {{- include "governance-service.labels" . | nindent 4 }}
type: Opaque
data:
  databasePassword: {{ .Values.secrets.databasePassword | b64enc | quote }}
  {{- if .Values.secrets.jwtSecret }}
  jwtSecret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- end }}
