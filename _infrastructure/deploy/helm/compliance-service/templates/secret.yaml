apiVersion: v1
kind: Secret
metadata:
  name: {{ include "compliance-service.fullname" . }}-secrets
  labels:
    {{- include "compliance-service.labels" . | nindent 4 }}
type: Opaque
data:
  databasePassword: {{ .Values.secrets.databasePassword | b64enc | quote }}
  {{- if .Values.secrets.jwtSecret }}
  jwtSecret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.kycProviderApiKey }}
  kycProviderApiKey: {{ .Values.secrets.kycProviderApiKey | b64enc | quote }}
  {{- end }}
