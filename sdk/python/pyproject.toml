[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ahoy-tokenisation"
version = "1.0.0"
description = "Python SDK for AHOY Tokenisation Platform - Tokenize real-world assets with compliance"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AHOY Engineering", email = "engineering@ahoy.fund"}
]
maintainers = [
    {name = "AHOY Engineering", email = "engineering@ahoy.fund"}
]
keywords = [
    "tokenisation",
    "tokenization",
    "rwa",
    "real-world-assets",
    "blockchain",
    "compliance",
    "kyc",
    "securities",
    "erc3643"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "respx>=0.20.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://ahoy.fund"
Documentation = "https://docs.ahoy.fund/sdk/python"
Repository = "https://github.com/ahoy-fund/tokenisation-sdk"
Changelog = "https://github.com/ahoy-fund/tokenisation-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["ahoy_tokenisation*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
